name: Staging Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kubeconfig
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Render manifests
        run: |
          mkdir -p rendered
          cp infra/backend-deployment.yaml rendered/
      - name: Deploy to cluster
        run: |
          kubectl apply -f rendered/backend-deployment.yaml
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/bug-bounty-backend
